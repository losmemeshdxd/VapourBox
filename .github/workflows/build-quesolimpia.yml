name: Build macOS QuesoLimpia

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15  # Apple Silicon runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager in Flutter
        run: |
          flutter config --no-enable-swift-package-manager
          flutter precache --macos

      - name: Setup CocoaPods
        run: |
          gem install cocoapods

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Package VapourBox macOS with QuesoLimpia (DMG + App)
        run: |
          chmod +x ./Scripts/package-macos.sh
          ./Scripts/package-macos.sh --no-sign --arch arm64

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VapourBox-macOS-arm64-QuesoLimpia-DMG
          path: dist/*.dmg

      - name: Upload App Zip Artifact
        run: |
          cd dist
          zip -r -y VapourBox-macOS-arm64-QuesoLimpia-App.zip VapourBox.app
        
      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VapourBox-macOS-arm64-QuesoLimpia-App
          path: dist/VapourBox-macOS-arm64-QuesoLimpia-App.zip
