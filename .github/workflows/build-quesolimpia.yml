name: Build macOS QuesoLimpia

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15  # Apple Silicon (macOS 15 runner with Xcode)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager in Flutter
        run: |
          flutter config --no-enable-swift-package-manager

      - name: Setup CocoaPods
        run: |
          gem install cocoapods

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build Rust worker (ARM64)
        run: |
          cd worker
          cargo build --release --target aarch64-apple-darwin

      - name: Build Flutter macOS App (Two-step xcodebuild with CocoaPods)
        env:
          VAPOURBOX_ARCHS: arm64
          VAPOURBOX_DEPLOYMENT_TARGET: "15.0"
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: |
          cd app
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

          # Generate ephemeral Flutter macOS files
          flutter build macos --release || true

          # Clean and install CocoaPods
          cd macos
          rm -rf Pods Podfile.lock
          pod install

          # Build Pods-Runner scheme
          xcodebuild -workspace Runner.xcworkspace -scheme Pods-Runner \
              -configuration Release build ONLY_ACTIVE_ARCH=NO \
              ARCHS="arm64" \
              MACOSX_DEPLOYMENT_TARGET="15.0" \
              -quiet

          # Build Runner scheme
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
              -configuration Release build ONLY_ACTIVE_ARCH=NO \
              ARCHS="arm64" \
              MACOSX_DEPLOYMENT_TARGET="15.0" \
              -quiet

          # Locate built .app
          DERIVED_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "vapourbox.app" -o -name "VapourBox.app" 2>/dev/null | head -1)
          if [ -z "$DERIVED_APP" ]; then
              DERIVED_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | head -1)
          fi
          echo "Found built app at: $DERIVED_APP"

          mkdir -p ../build/macos/Build/Products/Release
          cp -R "$DERIVED_APP" ../build/macos/Build/Products/Release/VapourBox.app

      - name: Assemble VapourBox Bundle with QuesoLimpia
        run: |
          APP_PATH="app/build/macos/Build/Products/Release/VapourBox.app"
          echo "Assembling bundle at $APP_PATH"

          # Inject updated Rust worker
          cp worker/target/aarch64-apple-darwin/release/vapourbox-worker "$APP_PATH/Contents/MacOS/vapourbox-worker"
          chmod +x "$APP_PATH/Contents/MacOS/vapourbox-worker"

          # Inject templates including quesolimpia.py
          mkdir -p "$APP_PATH/Contents/Resources/templates"
          cp -R worker/templates/* "$APP_PATH/Contents/Resources/templates/"

          # Package as Zip
          cd app/build/macos/Build/Products/Release
          zip -r -y VapourBox-macOS-arm64-QuesoLimpia.zip VapourBox.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VapourBox-macOS-arm64-QuesoLimpia
          path: app/build/macos/Build/Products/Release/VapourBox-macOS-arm64-QuesoLimpia.zip
